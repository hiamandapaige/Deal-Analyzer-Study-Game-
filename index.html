<title>Deal Analyzer Drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* A clean, modern monster-battle game: deep navy backdrop, white rounded cards, smooth cartoon art. One fixed visual world. */
:root {
  --bg: #1F2340;
  --bg-2: #2B3058;
  --card: #FFFFFF;
  --card-2: #F3F5FA;
  --ink: #1E2236;
  --muted: #5D6482;
  --line: #E1E5EF;
  --on-bg: #F1F3FB;
  --on-bg-muted: #B3B9D6;
  --sky-top: #8FD0F2;
  --sky-low: #E4F5FC;
  --grass: #86CF72;
  --grass-2: #6BBE5E;
  --plat: #C2E9AC;
  --plat-edge: #94CF80;
  --path: #F0DFAE;
  --red: #E5533F;
  --red-dark: #B53A28;
  --yellow: #FFCB45;
  --yellow-dark: #D49C17;
  --blue: #3E6FD8;
  --green: #2E9E5B;
  --hp-hi: #3CC46A;
  --hp-mid: #F2C230;
  --hp-low: #E0483B;
  --good-soft: #E1F5E8;
  --bad-soft: #FDE6E1;
  --hint: #FFF6D6;
  --code-bg: #1E2236;
  --code-fg: #E9ECF5;
  --font-display: "Fredoka", "Nunito", "Trebuchet MS", Arial, sans-serif;
  --font-body: "Nunito", "Trebuchet MS", Arial, sans-serif;
  --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;
  --shadow: 0 8px 22px rgba(8, 12, 36, 0.32);
  --shadow-sm: 0 3px 10px rgba(8, 12, 36, 0.18);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: radial-gradient(120% 70% at 50% 0%, #2D3363 0%, var(--bg) 65%) var(--bg);
  color: var(--on-bg);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 44px;
  min-height: 100vh;
}
.app { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.art { display: block; line-height: 0; }
.art svg { width: 100%; height: auto; display: block; overflow: visible; }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 0.85em; }

.card { background: var(--card); color: var(--ink); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; }

/* Trainer card */
.trainer { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(var(--sky-low), #CBEAF7); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.avatar .art { width: 58px; }
.who { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.who .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.who .name { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.2; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card-2); color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 14px; font-weight: 700; }
.bar { height: 10px; border-radius: 999px; background: #E3E7F1; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--blue); transition: width 0.5s ease; }
.small { font-size: 14px; color: var(--muted); font-weight: 600; }
.badges { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.badge { width: 30px; height: 30px; }

/* Tabs: segmented control */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg-2); border-radius: 14px; padding: 4px; }
.tab { border: 0; background: transparent; color: var(--on-bg-muted); border-radius: 11px; min-height: 44px; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }

/* Buttons */
.btn { --edge: rgba(0, 0, 0, 0.25); border: 0; border-radius: 14px; padding: 12px 18px; min-height: 54px; font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 0 var(--edge); transition: transform 0.08s ease, box-shadow 0.08s ease; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.btn-go { background: var(--red); color: #FFFFFF; --edge: var(--red-dark); }
.btn-yellow { background: var(--yellow); color: var(--ink); --edge: var(--yellow-dark); }
.btn-alt { background: var(--card); color: var(--ink); --edge: #C3C9DA; }
.btn-block { width: 100%; }
.btn-stack { flex-direction: column; gap: 2px; padding-block: 12px; }
.btn-sub { font-family: var(--font-body); font-weight: 600; font-size: 15px; opacity: 0.95; }

/* Map */
.route { background: linear-gradient(160deg, var(--grass), var(--grass-2)); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.route-head { background: var(--card); color: var(--ink); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow-sm); }
.route-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; }
.prize { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: var(--muted); }
.prize .badge { width: 20px; height: 20px; }
.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.stop { position: relative; display: grid; grid-template-columns: 58px 1fr 34px; gap: 12px; align-items: center; padding: 6px 0; }
.stop::before { content: ""; position: absolute; left: 25px; top: 0; bottom: 0; width: 8px; border-radius: 4px; background: var(--path); opacity: 0.9; z-index: 0; }
.stop:first-child::before { top: 50%; }
.stop:last-child::before { bottom: 50%; }
.stop:only-child::before { display: none; }
.tile { position: relative; z-index: 1; width: 58px; height: 58px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; }
.tile .art { width: 44px; }
.stop.is-next .tile { box-shadow: 0 0 0 4px var(--yellow), var(--shadow-sm); }
.stop-btn { text-align: left; background: var(--card); color: var(--ink); border: 0; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 58px; justify-content: center; box-shadow: var(--shadow-sm); }
.stop-btn .t { font-weight: 800; font-size: 17px; line-height: 1.3; }
.stop-btn .m { font-size: 14px; font-weight: 600; color: var(--muted); }
.stop.is-done .stop-btn .m { color: var(--green); }
.stop.is-next .stop-btn .m { color: var(--red); }
.here .art { width: 34px; }
@media (prefers-reduced-motion: no-preference) {
  .stop.is-next .here .art { animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
}

/* Battle scene */
.scene { position: relative; width: 100%; aspect-ratio: 16 / 11; border-radius: 20px; overflow: hidden; background: linear-gradient(var(--sky-top), var(--sky-low) 56%, var(--grass) 56%, var(--grass-2) 100%); box-shadow: var(--shadow); }
.cloud { position: absolute; background: #FFFFFF; border-radius: 999px; opacity: 0.8; }
.cloud.c1 { width: 18%; height: 7%; left: 50%; top: 8%; }
.cloud.c2 { width: 12%; height: 5%; left: 8%; top: 36%; opacity: 0.6; }
.plat { position: absolute; border-radius: 50%; background: radial-gradient(var(--plat) 55%, var(--plat-edge)); }
.plat.foe { right: 6%; top: 41%; width: 40%; height: 12%; }
.plat.me { left: 3%; bottom: 5%; width: 46%; height: 14%; }
.spr { position: absolute; }
.spr.foe { right: 12%; top: 9%; width: 28%; }
.spr.me { left: 11%; bottom: 9%; width: 28%; }
.hud { position: absolute; background: rgba(255, 255, 255, 0.96); color: var(--ink); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; width: 46%; box-shadow: var(--shadow-sm); }
.hud.foe { left: 4%; top: 6%; }
.hud.me { right: 4%; bottom: 7%; }
.hud .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.hud .who-n { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; }
.hud .lv { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.hp { display: flex; align-items: center; gap: 6px; }
.hp b { font-size: 11px; font-weight: 800; color: #FFFFFF; background: var(--ink); padding: 1px 5px; border-radius: 4px; }
.hp .bar { flex: 1; height: 8px; }
.hp .bar i { transition: width 0.6s ease, background 0.6s ease; }
.hp-n { font-size: 13px; font-weight: 700; text-align: right; color: var(--muted); }
.defeated .art { opacity: 0.25; filter: grayscale(1); transition: opacity 0.6s ease; }
@media (prefers-reduced-motion: no-preference) {
  .shake { animation: shake 0.4s ease; }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  .flash .art { animation: flash 0.5s ease 2; }
  @keyframes flash { 50% { opacity: 0.2; } }
  .enter { animation: enter 0.5s cubic-bezier(.2,.8,.3,1.2); }
  @keyframes enter { from { transform: translateX(50%) scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }
  .idle .art { animation: breathe 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes breathe { 50% { transform: scale(1.03, 0.97); } }
}

/* Dialog */
.dialog { background: var(--card); color: var(--ink); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.dialog h2 { font-weight: 800; font-size: 21px; line-height: 1.3; }
.dialog p { font-size: 18px; line-height: 1.55; }
.announce { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--red); }
.code { background: var(--code-bg); color: var(--code-fg); font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; border-radius: 10px; padding: 12px 14px; margin: 0; overflow-x: auto; white-space: pre; }
.hintbox { background: var(--hint); border-left: 4px solid var(--yellow-dark); border-radius: 10px; padding: 10px 12px; font-size: 16px; line-height: 1.5; }
.hintbox .kicker { color: #8A6A10; display: block; margin-bottom: 2px; }
.result { border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.result p { font-size: 17px; }
.result-good { background: var(--good-soft); }
.result-bad { background: var(--bad-soft); }
.result .verdict { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.result-good .verdict { color: var(--green); }
.result-bad .verdict { color: var(--red); }

.tagchip { align-self: flex-start; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.tag-spot { box-shadow: inset 5px 0 0 var(--blue), var(--shadow); }
.tag-spot .tagchip { background: #E3ECFF; color: #2C55B0; }
.tag-anywhere { box-shadow: inset 5px 0 0 var(--green), var(--shadow); }
.tag-anywhere .tagchip { background: #DFF3E6; color: #1F7340; }

/* Professor */
.prof { display: flex; gap: 12px; align-items: flex-end; }
.portrait { width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(var(--sky-low), #CBEAF7); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-shadow: var(--shadow-sm); flex: none; }
.portrait .art { width: 74px; }
.speaker { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; }
.speaker .n { font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--on-bg); }
.speaker .s { font-size: 14px; color: var(--on-bg-muted); font-weight: 600; }

/* Answer moves */
.moves { display: flex; flex-direction: column; gap: 8px; }
.move { text-align: left; background: var(--card); color: var(--ink); border: 2px solid transparent; border-radius: 14px; padding: 10px 12px; min-height: 56px; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; box-shadow: var(--shadow-sm); font-size: 17px; line-height: 1.4; font-weight: 600; transition: transform 0.08s ease; }
.move:hover:not(:disabled) { border-color: var(--blue); }
.move:active:not(:disabled) { transform: scale(0.99); }
.move .key { width: 32px; height: 32px; border-radius: 50%; background: var(--card-2); color: var(--muted); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.move .txt { min-width: 0; overflow-wrap: anywhere; }
.move:disabled { cursor: default; }
.move.ok { background: var(--good-soft); border-color: var(--green); }
.move.ok .key { background: var(--green); color: #FFFFFF; }
.move.no { background: var(--bad-soft); border-color: var(--red); }
.move.no .key { background: var(--red); color: #FFFFFF; }
.move.dim { background: #E9ECF4; color: #4A5068; box-shadow: none; }
.move .tag { display: block; font-size: 13px; font-weight: 800; margin-top: 2px; }
.move.ok .tag { color: var(--green); }
.move.no .tag { color: var(--red); }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 12px; }
.icon-btn { width: 44px; height: 44px; flex: none; border: 0; background: var(--bg-2); color: var(--on-bg); border-radius: 12px; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.topbar .bar { flex: 1; height: 12px; background: var(--bg-2); }
.topbar .bar i { background: var(--yellow); }
.count { font-size: 15px; font-weight: 700; color: var(--on-bg-muted); white-space: nowrap; }

/* Bug log */
.log-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.entry { background: var(--card); color: var(--ink); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: var(--shadow-sm); }
.entry .pic { background: linear-gradient(var(--sky-low), #D6F0DE); border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 10px; }
.entry .pic .art { width: 76px; }
.entry .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.entry .nm { font-family: var(--font-display); font-weight: 600; font-size: 18px; overflow-wrap: anywhere; }
.entry p { font-size: 15px; line-height: 1.45; }
.type { color: #FFFFFF; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; }

/* Training */
.train-row { background: var(--card); color: var(--ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); }
.train-row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.train-row .t { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.train-row .bar i { background: var(--green); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo .btn { min-height: 46px; font-size: 17px; padding: 8px 10px; }
.section-title { font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--on-bg); padding-top: 6px; }
.note { color: var(--on-bg-muted); font-size: 15px; font-weight: 600; }

/* Study cards */
.study { min-height: 260px; width: 100%; text-align: left; border: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.study .term { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.25; overflow-wrap: anywhere; }
.study .def { font-size: 19px; line-height: 1.55; }
.study.back { background: #EAF1FF; }

/* Results */
.learned { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.learned li { padding-left: 28px; position: relative; font-size: 17px; }
.learned li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: var(--good-soft); color: var(--green); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.banner { background: var(--yellow); color: var(--ink); border-radius: 16px; padding: 12px 14px; text-align: center; box-shadow: var(--shadow-sm); }
.banner .t { font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.catch { display: grid; grid-template-columns: 100px 1fr; gap: 14px; align-items: center; }
.catch .pic { background: linear-gradient(var(--sky-low), #D6F0DE); border-radius: 14px; padding: 10px; display: flex; justify-content: center; }
.catch .pic .art { width: 78px; }
.catch h2 { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.2; margin: 4px 0; }
.missed { display: flex; flex-direction: column; gap: 10px; }
.missed .card { box-shadow: var(--shadow-sm); padding: 14px; }
.missed .card p + p { margin-top: 4px; }
.ans { color: var(--green); font-weight: 800; }
.confirm { background: var(--bad-soft); color: var(--ink); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.linkish { background: none; border: 0; color: var(--on-bg-muted); text-decoration: underline; font-size: 15px; padding: 6px 0; align-self: flex-start; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 380px) {
  .log-grid { grid-template-columns: 1fr; }
  .hud { width: 50%; padding: 6px 9px; }
  .hud .who-n { font-size: 14px; }
}
</style>

<script>
const TOPICS = [
  { id: "core", name: "Core Python", blurb: "Variables, types, lists, loops, if, functions, dictionaries" },
  { id: "setup", name: "Setup and Git", blurb: "Terminal, virtual environment, Git, folders" },
  { id: "python", name: "Classes, types, imports", blurb: "Designing data, imports, reading errors" },
  { id: "db", name: "Databases and SQL", blurb: "SQLite, tables, saving safely" },
  { id: "pipe", name: "The data pipeline", blurb: "pandas, messy data, ETL" },
];

// Each question: the first option is the correct one; options are shuffled when shown.
const QS = [
  // Core Python (works in any project)
  { id: "k1", t: "core", q: `What does this line do?`, code: `total = 25`, a: [`Stores 25 under the name total`, `Checks whether total equals 25`, `Prints 25 on the screen`, `Creates a file named total`], why: `A single = means “store.” Python puts the value on the right into the name on the left. It isn’t a math question.` },
  { id: "k2", t: "core", q: `What does this print?`, code: `coins = 5\ncoins = coins + 10\nprint(coins)`, a: [`15`, `5`, `10`, `coins + 10`], why: `Python works out the right side first (5 + 10 = 15), then stores the result back in coins, replacing the old 5.` },
  { id: "k3", t: "core", q: `Which line creates a variable?`, a: [`city = "Austin"`, `print(city)`, `"Austin"`, `city == "Austin"`], why: `name = value creates (or updates) a variable. Two equals signs (==) compare instead; you’ll meet that with if.` },
  { id: "k4", t: "core", q: `In a weather app, which is the best variable name for today’s high temperature?`, a: [`high_temp`, `High Temp`, `2day_high`, `x`], why: `Names can’t contain spaces or start with a digit. Python style is lowercase_with_underscores, and a clear name beats a short one.` },
  { id: "k5", t: "core", q: `What type is "42", written with the quotes?`, a: [`str (text)`, `int (whole number)`, `float (decimal)`, `bool (True/False)`], why: `Quotes always make text, even if what’s inside looks like a number. Without quotes, 42 would be an int.` },
  { id: "k6", t: "core", q: `What does this print?`, code: `print("10" + "5")`, a: [`105`, `15`, `An error`, `10 + 5`], why: `Both values are text, and + joins text end to end. To add them as numbers, they’d need to be 10 + 5 without quotes.` },
  { id: "k7", t: "core", q: `This line crashes with a TypeError. Which version fixes it?`, code: `print("Lives: " + 3)`, a: [`print("Lives: " + str(3))`, `print("Lives: " + int(3))`, `print(Lives: + 3)`, `print("Lives: " - 3)`], why: `You can’t join text and a number. str(3) converts the number to the text "3", so + can join them.` },
  { id: "k8", t: "core", q: `What does this print?`, code: `colors = ["red", "green", "blue"]\nprint(colors[1])`, a: [`green`, `red`, `blue`, `An error`], why: `Lists count from 0. colors[0] is red, colors[1] is green, colors[2] is blue.` },
  { id: "k9", t: "core", q: `Fill in the blank to add "outro" to the end of the list:`, code: `playlist = ["intro"]\nplaylist.______("outro")\n# playlist is now ["intro", "outro"]`, a: [`append`, `add`, `push`, `insert_end`], why: `list.append(item) adds one item to the end of a list. It’s the same in every Python project.` },
  { id: "k10", t: "core", q: `Which of these is a list?`, a: [`[3, 7, 12]`, `(3 + 7)`, `"3, 7, 12"`, `{"a": 3}`], why: `Square brackets with items separated by commas make a list. In quotes it’s just text; curly braces make a dictionary.` },
  { id: "k11", t: "core", q: `How many times does print run?`, code: `for name in ["Ana", "Ben", "Cy", "Dee"]:\n    print(name)`, a: [`4`, `1`, `3`, `0`], why: `A for loop runs its indented lines once for each item. Four names, four runs.` },
  { id: "k12", t: "core", q: `What does this print?`, code: `total = 0\nfor price in [5, 10, 20]:\n    total = total + price\nprint(total)`, a: [`35`, `20`, `5, 10, then 20`, `0`], why: `Each time around, the current price is added to total: 0+5, then 15, then 35. print is not indented, so it runs once, after the loop.` },
  { id: "k13", t: "core", q: `Which line starts a loop?`, a: [`for score in scores:`, `scores = [90, 85]`, `print(scores)`, `scores.append(77)`], why: `A loop starts with for, has in, and ends with a colon. The indented lines under it repeat.` },
  { id: "k14", t: "core", q: `What does == do?`, a: [`Checks whether two values are equal`, `Stores a value in a variable`, `Adds two numbers`, `Copies a list`], why: `One = stores. Two == compares and gives True or False. Mixing them up is one of the most common beginner bugs.` },
  { id: "k15", t: "core", q: `What does this print?`, code: `age = 16\nif age >= 18:\n    print("Can vote")\nelse:\n    print("Too young")`, a: [`Too young`, `Can vote`, `Both lines`, `Nothing`], why: `16 >= 18 is False, so Python skips the if block and runs the else block.` },
  { id: "k16", t: "core", q: `What is grade after this runs?`, code: `score = 82\nif score >= 90:\n    grade = "A"\nelif score >= 80:\n    grade = "B"\nelse:\n    grade = "C"`, a: [`"B"`, `"A"`, `"C"`, `"B" and "C"`], why: `Python checks from the top and stops at the first True. 82 >= 90 is False; 82 >= 80 is True, so grade is "B" and the rest is skipped.` },
  { id: "k17", t: "core", q: `A shop gives free shipping on orders of $50 or more. Which line checks that?`, a: [`if total >= 50:`, `if total = 50:`, `for total in 50:`, `total >= 50 = True`], why: `if, then a comparison, then a colon. >= means “greater than or equal to.” A single = would try to store, not compare.` },
  { id: "k18", t: "core", q: `In this function, what is price?`, code: `def add_tax(price):\n    return price * 1.08`, a: [`The input the function receives each time it’s called`, `A variable that is always 1.08`, `The function’s name`, `The value it prints`], why: `Names in the parentheses after def are parameters: blanks that get filled in when you call it. add_tax(100) runs with price = 100.` },
  { id: "k19", t: "core", q: `What does this print?`, code: `def greet(name):\n    return "Hi, " + name\n\nmessage = greet("Sam")\nprint(message)`, a: [`Hi, Sam`, `Hi, name`, `greet("Sam")`, `Nothing`], why: `greet("Sam") runs the function with name = "Sam". return hands back "Hi, Sam", which is stored in message and printed.` },
  { id: "k20", t: "core", q: `Which line CALLS a function, instead of defining one?`, a: [`total = add_tax(20)`, `def add_tax(price):`, `return price * 1.08`, `price = 20`], why: `def writes the recipe. The function’s name followed by parentheses, without def, runs it.` },
  { id: "k21", t: "core", q: `What does this print?`, code: `pet = {"name": "Rex", "kind": "dog"}\nprint(pet["kind"])`, a: [`dog`, `kind`, `Rex`, `An error`], why: `A dictionary looks values up by key. The key "kind" holds the value "dog".` },
  { id: "k22", t: "core", q: `Using the same pet dictionary, what happens here?`, code: `print(pet["Name"])`, a: [`A KeyError, because the key is "name", not "Name"`, `It prints Rex`, `It prints None`, `It adds a new key`], why: `Keys must match exactly, including capital letters and spaces. A missing key raises a KeyError.` },
  { id: "k23", t: "core", q: `Which of these is a dictionary?`, a: [`{"city": "Austin", "zip": "78701"}`, `["Austin", "78701"]`, `"city: Austin"`, `(Austin, 78701)`], why: `Curly braces holding key: value pairs make a dictionary. Square brackets make a list.` },
  { id: "k24", t: "core", q: `In row["PRICE"], what is "PRICE"?`, a: [`The key being looked up, like a column name`, `A list position`, `A function`, `A new variable`], why: `Square brackets with text inside mean “look up this key.” With a number inside, like items[0], it’s a list position.` },
  { id: "k25", t: "core", q: `What does the workout program print?`, code: `workouts = [\n    {"day": "Mon", "minutes": 30},\n    {"day": "Wed", "minutes": 0},\n    {"day": "Fri", "minutes": 45},\n]\n\ndef total_minutes(log):\n    total = 0\n    for w in log:\n        if w["minutes"] > 0:\n            total = total + w["minutes"]\n    return total\n\nprint(total_minutes(workouts))`, a: [`75`, `30`, `3`, `0`], why: `The loop visits each day. Monday adds 30, Wednesday is skipped by the if, Friday adds 45. 30 + 45 = 75.` },
  { id: "k26", t: "core", q: `In the workout program, what is workouts?`, a: [`A list of dictionaries, one per day`, `A function`, `A single dictionary`, `A loop`], why: `Square brackets on the outside make a list; each item inside is a dictionary in curly braces. This shape is everywhere: rows of data, posts, contacts.` },
  { id: "k27", t: "core", q: `In the workout program, which line makes a decision?`, a: [`if w["minutes"] > 0:`, `for w in log:`, `total = 0`, `return total`], why: `if checks a condition and only runs its indented line when it’s True. for repeats; it doesn’t decide.` },
  { id: "k28", t: "core", q: `You’re building a to-do app: “For each task that isn’t done, show it.” Which pieces does that sentence need?`, a: [`A loop and an if`, `Only a dictionary`, `Only an import`, `A database and a class`], why: `“For each” becomes a for loop. “That isn’t done” becomes an if. Describing the job in plain English tells you which pieces to use.` },
  { id: "k29", t: "python", q: `In this code, what is track?`, code: `track = Song(title="Intro", artist="Kai", seconds=185)`, a: [`An object: one filled-out Song`, `The Song class`, `A field`, `A list of songs`], why: `Song is the blank form (the class). Calling it fills out one copy, an object, stored in track.` },
  { id: "k30", t: "python", q: `A running app stores steps taken and miles run each day. Which types fit?`, a: [`steps: int, miles: float`, `steps: str, miles: str`, `steps: float, miles: int`, `steps: bool, miles: bool`], why: `Steps are always whole numbers. Miles can be 3.2. And you do math on both, so neither should be text.` },
  { id: "k31", t: "python", q: `What does this error mean?`, code: `IndentationError: expected an indented block`, a: [`A line after a colon isn’t indented`, `The file has too many spaces`, `A variable name is too long`, `An import is missing`], why: `Every line ending in a colon (for, if, def, class) needs an indented block under it. Python uses indentation to see what belongs inside.` },
  { id: "k32", t: "pipe", q: `This line sits inside a loop over the file’s rows. If the file has 103 rows, how many times does it run?`, code: `properties.append(row_to_property(row, today))`, a: [`103`, `1`, `0`, `It depends on the price`], why: `Indented lines inside a for loop run once per item. One row in, one Property appended.` },

  // Setup and Git
  { id: "s1", t: "setup", q: `Where do you type this command?`, code: `python3 hello.py`, a: [`In the terminal`, `Inside hello.py`, `In .gitignore`, `In README.md`], why: `The file holds instructions; the terminal runs them. Typed into the file, Python tries to run it as code and you get errors.` },
  { id: "s2", t: "setup", q: `What does this line do?`, code: `print("Hello, real estate!")`, a: [`Shows the text in the terminal`, `Saves the text to a file`, `Sends it to a printer`, `Creates a variable named Hello`], why: `print is a built-in function whose one job is showing text. The text in quotes is a string.` },
  { id: "s3", t: "setup", q: `What is a virtual environment (.venv) for?`, a: [`Keeping this project’s packages separate from the rest of your computer`, `Making Python run faster`, `Backing up your code online`, `Hiding files from Git`], why: `It’s a private toolbox. Packages install inside it, so two projects that need different versions can’t break each other.` },
  { id: "s4", t: "setup", q: `How can you tell your virtual environment is turned on?`, a: [`The terminal line starts with (.venv)`, `VS Code turns green`, `File names turn blue`, `git status says so`], why: `When it’s active, your prompt begins with (.venv). Check for it before running pip install.` },
  { id: "s5", t: "setup", q: `You open a new terminal and (.venv) is missing. What do you run?`, a: [`source .venv/bin/activate`, `python3 -m venv .venv`, `git init`, `pip install venv`], why: `Creating the box (python3 -m venv .venv) happens once. Turning it on with source happens in every new terminal.` },
  { id: "s6", t: "setup", q: `What does this command do?`, code: `git commit -m "Add Property data model"`, a: [`Saves a snapshot of the staged files with that message`, `Uploads your code to GitHub`, `Creates a file with that name`, `Deletes old versions`], why: `commit takes the snapshot; -m adds the message describing what changed. Uploading is a separate step: git push.` },
  { id: "s7", t: "setup", q: `What’s the difference between commit and push?`, a: [`Commit saves a snapshot on your computer; push uploads snapshots to GitHub`, `They do the same thing`, `Push saves locally; commit uploads`, `Commit is for code; push is for data`], why: `Commit is your local save point. Push sends your save points to GitHub, your online backup and portfolio.` },
  { id: "s8", t: "setup", q: `Why is .env listed in .gitignore?`, a: [`It holds secret keys that must never go online`, `It’s too large for Git`, `Git can’t read it`, `Python creates it automatically`], why: `An API key works like a password for a service. If it reaches GitHub, anyone can use it. .gitignore stops it from being added by accident.` },
  { id: "s9", t: "setup", q: `Why is the data/ folder kept out of Git?`, a: [`Downloaded data is large, changes often, and isn’t yours to republish`, `Git can’t store CSV files`, `It slows down Python`, `VS Code requires it`], why: `Git is for your code. Downloaded data stays on your computer.` },
  { id: "s10", t: "setup", q: `What does an empty file named __init__.py do inside a folder?`, a: [`Labels the folder as a package so files can import from each other`, `Starts the app`, `Stores your settings`, `Nothing; it’s safe to delete`], why: `Its existence is its whole job. It’s what lets you write from app.models import Property.` },
  { id: "s11", t: "setup", q: `Which command shows what’s new, changed, or ready to commit?`, a: [`git status`, `git log`, `git init`, `git push`], why: `Run git status before every commit so nothing sneaks in by accident.` },
  { id: "s12", t: "setup", q: `In this command, what does app/ mean?`, code: `git add app/`, a: [`Stage everything in the app folder for the next snapshot`, `Create a folder named app`, `Delete the app folder`, `Push the app folder to GitHub`], why: `git add chooses what goes into the next commit. You can name single files or whole folders.` },

  // Classes, types, imports
  { id: "p1", t: "python", q: `In the paper-form picture, what is a class?`, a: [`The blank form’s design`, `One filled-out form`, `One box on the form`, `What’s written in a box`], why: `A class is a blueprint: it says what boxes every copy has. Property, Song, and Contact could all be classes.` },
  { id: "p2", t: "python", q: `In this line, what is home?`, code: `home = Property(address="123 Oak St", ...)`, a: [`An object: one filled-out form`, `A class`, `A field`, `A database table`], why: `Calling the class fills out one copy of the form. That copy is an object, stored in the variable home.` },
  { id: "p3", t: "python", q: `What does home.price give you?`, a: [`The price stored in that one object`, `The class definition`, `A list of all prices`, `An error`], why: `The dot means “look inside home and get its price field.” track.artist would do the same for a Song.` },
  { id: "p4", t: "python", q: `Why is zip_code stored as text (str) instead of a number?`, a: [`Numbers drop leading zeros, and you never do math on ZIP codes`, `Text uses less memory`, `int can’t hold five digits`, `SQLite requires it`], why: `02134 would become 2134. Rule: if it looks like a number but you’d never do math on it, store it as text.` },
  { id: "p5", t: "python", q: `Why is baths a float but beds an int?`, a: [`Half baths exist, like 2.5; bedrooms are always whole`, `Floats are faster`, `Bedrooms can be negative`, `No real reason`], why: `Pick each type by thinking about every value the field could realistically hold.` },
  { id: "p6", t: "python", q: `What does this field mean?`, code: `sqft: int | None = None`, a: [`A whole number or blank, and it starts blank`, `It must always be filled in`, `It defaults to zero`, `It holds text`], why: `The | reads as “or.” The = None makes it a fill-if-you-know box.` },
  { id: "p7", t: "python", q: `What happens if you leave out a required field like price when creating an object?`, a: [`Python raises a TypeError`, `price becomes 0`, `price becomes None`, `It saves without a price`], why: `A field with no default is must-fill. Python stops you: TypeError: missing 1 required positional argument: 'price'.` },
  { id: "p8", t: "python", q: `Why store an unknown size as None instead of 0?`, a: [`Zeros would wrongly drag down averages and other math`, `None takes less space`, `0 isn’t allowed`, `There’s no difference`], why: `None means unknown. Your code can skip unknowns instead of treating them as real numbers. Same for a missing test score or an unknown age.` },
  { id: "p9", t: "python", q: `What does this error most likely mean?`, code: `NameError: name 'date' is not defined`, a: [`This file uses date without importing it, or there’s a typo`, `The date format is wrong`, `The database is missing`, `date is a reserved word`], why: `A NameError means Python saw a name it doesn’t recognize in this file. Usually a missing import or a typo.` },
  { id: "p10", t: "python", q: `try_models.py imports Property from app.models. Does it also get date automatically?`, a: [`No. Each file must import what it uses`, `Yes, imports carry over`, `Only if it’s in the same folder`, `Only for built-in tools`], why: `from app.models import Property brings over Property and nothing else. Each file has its own toolbox.` },
  { id: "p11", t: "python", q: `What does @dataclass do?`, a: [`Writes the setup and printing code, so you only list the fields`, `Connects the class to the database`, `Makes the class run faster`, `Turns the class into a function`], why: `It’s a decorator: a tag that upgrades the code below it. Without it you’d write the setup code for every field yourself.` },
  { id: "p12", t: "python", q: `In a dataclass, which fields must come first?`, a: [`Required fields, then optional ones with defaults`, `Optional fields first`, `Alphabetical order`, `Order doesn’t matter`], why: `Python refuses a field without a default after one with a default.` },
  { id: "p13", t: "python", q: `Where should you look first when reading an error?`, a: [`The last line`, `The first line`, `The middle`, `Only the file name`], why: `The last line names the kind of error and what went wrong. The lines above show which file and line.` },
  { id: "p14", t: "core", q: `What does def do?`, a: [`Defines a function: a named, reusable job`, `Deletes a variable`, `Defines a database`, `Sets a default value`], why: `def starts a function definition. Nothing inside runs until you call the function by name.` },
  { id: "p15", t: "core", q: `What does properties[0] give you?`, a: [`The first item in the list`, `The last item`, `An empty list`, `The number zero`], why: `Lists start counting at 0, so [0] is the first item. len(properties) tells you how many there are.` },

  // Databases and SQL
  { id: "d1", t: "db", q: `Why does a variable’s value disappear when the script ends?`, a: [`Variables live in memory, which is wiped when the script ends`, `Python deletes old objects`, `The database removes it`, `VS Code clears it`], why: `Memory is a whiteboard. A database is a notebook that keeps what you write.` },
  { id: "d2", t: "db", q: `What is SQLite?`, a: [`A database stored in a single file, built into Python`, `A website for storing code`, `A paid cloud service`, `A spreadsheet app`], why: `Nothing to install, free, and private to your computer. It also runs inside phones and web browsers.` },
  { id: "d3", t: "db", q: `Which SQL type matches Python’s float?`, a: [`REAL`, `TEXT`, `INTEGER`, `DECIMAL`], why: `str is TEXT, int is INTEGER, float is REAL.` },
  { id: "d4", t: "db", q: `How are dates stored in SQLite?`, a: [`As text, like 2026-11-04`, `With a DATE type`, `As whole numbers only`, `They can’t be stored`], why: `SQLite has no date type, so dates are converted to text with isoformat().` },
  { id: "d5", t: "db", q: `What does NOT NULL do on a column?`, a: [`Makes the column required`, `Allows blanks`, `Deletes empty rows`, `Sets the value to zero`], why: `NOT NULL is the database’s version of a must-fill box.` },
  { id: "d6", t: "db", q: `What does this rule prevent?`, code: `UNIQUE (address, zip_code)`, a: [`Saving the same address and ZIP twice`, `Two houses in the same ZIP`, `Blank addresses`, `Lowercase addresses`], why: `It’s duplicate protection. A sign-up table would use UNIQUE (email) the same way.` },
  { id: "d7", t: "db", q: `What happens if you forget conn.commit()?`, a: [`Your changes are thrown away`, `The database is deleted`, `Python crashes`, `Nothing; it saves anyway`], why: `commit saves the change. Without it, the work disappears when the connection closes.` },
  { id: "d8", t: "db", q: `What does this line at the bottom of a file do?`, code: `if __name__ == "__main__":`, a: [`Runs the code below only when you run this file directly`, `Runs only on the main Git branch`, `Makes the function public`, `Renames the file to main`], why: `When another file imports from this one, that block is skipped. It keeps “run me” code apart from “borrow me” code.` },
  { id: "d9", t: "db", q: `Why does the table command say IF NOT EXISTS?`, a: [`So running it twice doesn’t cause an error`, `To delete an old table first`, `To create two tables`, `To make it faster`], why: `If the table is already there, the command is skipped. That also means it won’t add new columns to an existing table.` },
  { id: "d10", t: "db", q: `At the sqlite> prompt, your SELECT shows ...> and waits. Why?`, a: [`You forgot the semicolon`, `The table is empty`, `You need .quit`, `The database is locked`], why: `SQL commands end with a semicolon. Type ; and press Enter. Dot-commands like .tables don’t need one.` },
  { id: "d11", t: "db", q: `What is id INTEGER PRIMARY KEY?`, a: [`A unique number the database gives each row automatically`, `The MLS number`, `The ZIP code`, `A password`], why: `Like a receipt number: 1, 2, 3… Other tables can point to a row by its id.` },
  { id: "d12", t: "db", q: `Why use placeholders like :address instead of pasting values into SQL?`, a: [`They fill values in safely, handle apostrophes, and block SQL injection`, `They’re faster to type`, `SQLite requires colons`, `They shrink the database`], why: `An address like O’Brien Ln would break hand-built SQL. Always use placeholders for values.` },
  { id: "d13", t: "db", q: `With INSERT OR IGNORE, what happens to a row that breaks a UNIQUE rule?`, a: [`It’s skipped quietly`, `It’s overwritten`, `The program crashes`, `A second copy is saved`], why: `OR IGNORE means “skip it instead of crashing.” cursor.rowcount is 0 for that row.` },
  { id: "d14", t: "db", q: `What does this query show?`, code: `SELECT property_type, COUNT(*)\nFROM properties\nGROUP BY property_type;`, a: [`How many properties there are of each type`, `Every property’s details`, `The most expensive property`, `The table’s design`], why: `GROUP BY sorts rows into piles; COUNT(*) counts each pile.` },
  { id: "d15", t: "db", q: `A store has a sales table with a product column. Which query counts sales per product?`, a: [`SELECT product, COUNT(*) FROM sales GROUP BY product;`, `SELECT * FROM sales;`, `SELECT COUNT(*) FROM sales;`, `GROUP sales BY COUNT;`], why: `Same pattern as properties per type: pick the column, COUNT(*), and GROUP BY that column.` },

  // The data pipeline
  { id: "e1", t: "pipe", q: `What does ETL stand for?`, a: [`Extract, Transform, Load`, `Enter, Test, Launch`, `Export, Translate, List`, `Edit, Train, Log`], why: `Read the data, reshape it, save it. Most data jobs follow this pattern.` },
  { id: "e2", t: "pipe", q: `Which package reads a CSV file into a table?`, a: [`pandas`, `sqlite3`, `pathlib`, `dataclasses`], why: `pd.read_csv reads the file into a DataFrame.` },
  { id: "e3", t: "pipe", q: `What is a DataFrame?`, a: [`A table in memory with rows and named columns`, `A picture frame for charts`, `A database file`, `A type of chart`], why: `Think of it as a spreadsheet you control with code. By convention it’s stored as df.` },
  { id: "e4", t: "pipe", q: `Why never hand-edit a raw data file?`, a: [`Next download has the same quirks; fix them once in code`, `It voids the site’s terms`, `Python can’t read edited files`, `Editing deletes the header`], why: `Fixes in code work on every future file. Fixes by hand have to be repeated forever.` },
  { id: "e5", t: "pipe", q: `ZIP codes came in as 39157.0. What fixes it?`, a: [`dtype={"ZIP OR POSTAL CODE": str}`, `int(zip_code)`, `df.round()`, `Edit the CSV by hand`], why: `It’s a dictionary that tells pandas: read this column as text instead of guessing.` },
  { id: "e6", t: "pipe", q: `Almost every column has exactly one blank, all in the same row. What’s the likely cause?`, a: [`One row isn’t real data, like a note or a footer`, `Every column is broken`, `The file is too big`, `pandas can’t read it`], why: `In the Redfin file it was a note saying some MLS listings aren’t included. dropna(subset=["ADDRESS"]) removes it.` },
  { id: "e7", t: "pipe", q: `Why did beds show as 3.0 instead of 3?`, a: [`pandas turns a column decimal if it has any blank`, `Redfin stores half bedrooms`, `The file was corrupted`, `CSV files can’t hold whole numbers`], why: `Whole-number columns can’t hold NaN. A helper converts each value back.` },
  { id: "e8", t: "pipe", q: `A file has a column named SOURCE, but it means the MLS name. Should it fill your source field (which importer brought the data in)?`, a: [`No: same word, different meaning`, `Yes: the names match`, `Only if it’s blank`, `Only for houses`], why: `Always check what a column actually contains, not just its name. Your source is set to "redfin" directly.` },
  { id: "e9", t: "pipe", q: `What does to_int() return for a blank value?`, a: [`None`, `0`, `An error`, `An empty string`], why: `Its if checks for a blank first and returns None, the word for unknown. Otherwise 3.0 becomes 3.` },
  { id: "e10", t: "core", q: `What does DRY stand for?`, a: [`Don’t repeat yourself`, `Do run yesterday`, `Data ready yet`, `Define, run, yield`], why: `Write a job once as a function and reuse it, instead of copying the same lines everywhere.` },
  { id: "e11", t: "core", q: `In this loop, what does the _ mean?`, code: `for _, row in df.iterrows():`, a: [`“I don’t need the row number”`, `Skip this row`, `A private variable`, `The last row`], why: `iterrows hands over two things each time: the row number and the row. The underscore is a placeholder name for the part you ignore.` },
  { id: "e12", t: "pipe", q: `Why does the importer move a file to data/raw only after saving it?`, a: [`So a crash leaves it in the inbox to retry`, `To save disk space`, `Git requires it`, `To sort files by date`], why: `Thinking about what happens when things fail is part of writing reliable code.` },
  { id: "e13", t: "pipe", q: `You import the same 103-listing file a second time. How many new rows are saved?`, a: [`0`, `103`, `206`, `It crashes`], why: `UNIQUE plus INSERT OR IGNORE skips every row that’s already there.` },
  { id: "e15", t: "pipe", q: `Why does the importer load every listing, even vacant land?`, a: [`Choosing what to keep is the cleaning step’s job; don’t throw data away early`, `Land is worth more`, `pandas can’t filter`, `Redfin requires it`], why: `Keeping import and cleaning separate means you never lose data by accident.` },
  { id: "e16", t: "pipe", q: `What does pip install pandas do?`, a: [`Downloads pandas into your active virtual environment`, `Creates a file named pandas`, `Uploads pandas to GitHub`, `Imports pandas into your script`], why: `pip is Python’s package installer. Record each package in requirements.txt, your project’s shopping list.` },

  // Fill-in-the-blank and applied checks
  { id: "n1", t: "setup", q: `Fill in the blank to turn on the virtual environment:`, code: `______ .venv/bin/activate`, a: [`source`, `python3`, `git`, `pip`], why: `source runs the activate script in your current terminal, which turns the box on.` },

  { id: "l4", u: "u1", title: "What stays out, and where files live", steps: [

    T("Why those?", [".env holds secrets like API keys: passwords that let your code use an online service. If one reaches GitHub, anyone can use it.", "data/ holds downloaded files. They’re large, they change, and they aren’t yours to republish. Git is for your code.", ".venv can be rebuilt anytime, and .DS_Store is Mac clutter."]),

  // ---------- Project 1: Describing a thing ----------
  { id: "l5", u: "u2", title: "Classes and objects", steps: [
    T("A class is a blank form", ["Picture a paper form with boxes for address, price, and bedrooms. The form’s design is a class.", "In the deal analyzer, that class is called Property."]),
    C("p1"),
    T("Objects fill out the form", "Filling out one copy for one house makes an object. Each box is a field, and what’s written in it is a value.", `home = Property(address="123 Oak St", price=215000, ...)`),

  { id: "l6", u: "u2", title: "Choosing types for a form", steps: [
    T("Every box has a type", "When you design a class, you choose a type for each field.", `address: str       # text\nprice: int         # whole number\nbaths: float       # decimal\ndate_seen: date    # a calendar date`),
    T("ZIP codes are text", ["A ZIP code looks like a number, but stored as one, 02134 becomes 2134. And you never do math on a ZIP code.", "Rule of thumb: if it looks like a number but you’d never do math on it, store it as text."]),
    C("p4"), C("n11"),

  { id: "l7", u: "u2", title: "Required and optional", steps: [
    T("@dataclass does the setup", "Put @dataclass above a class and Python writes the setup and printing code for you. You only list the fields. A tag starting with @ is called a decorator.", `@dataclass\nclass Property:\n    address: str\n    price: int\n    sqft: int | None = None`),
    C("p11"),
    T("Must-fill vs. fill-if-you-know", ["A field with no default is must-fill. Leave it out and Python stops you with a TypeError.", "Adding | None = None makes a field optional: blank unless you fill it in. The | reads as “or.”", "Required fields must come before optional ones."], `Property(address="9 Elm St")\n# TypeError: missing 1 required positional argument: 'price'`),
    C("p6"), C("n3"), C("p7"), C("p12"),

/* ---------- Art (smooth SVG) ---------- */
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function tint(hex, a) {
  const n = parseInt(hex.slice(1), 16), m = c => Math.round(c + (255 - c) * a);
  return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(c => m(c).toString(16).padStart(2, "0")).join("");
}
function art(svg, w, cls) {
  const s = document.createElement("span");
  s.className = "art" + (cls ? " " + cls : "");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = svg;
  if (w) s.style.width = w + "px";
  return s;
}
let GID = 0;

  const st = seen ? ' stroke="' + dark + '" stroke-width="2.5" stroke-linejoin="round"' : "";
  const shape = Math.floor(r() * 4), feat = Math.floor(r() * 5), oneEye = r() < 0.25, mouth = Math.floor(r() * 4), belly = r() < 0.6;
  const top = [28, 22, 34, 26][shape];
  let s = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">';
  if (seen) s += '<defs><radialGradient id="' + id + '" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="' + tint(base, 0.5) + '"/><stop offset="0.55" stop-color="' + base + '"/><stop offset="1" stop-color="' + dark + '"/></radialGradient></defs>';
  if (feat === 0) s += '<path d="M40 ' + (top + 8) + ' Q34 ' + (top - 6) + ' 28 ' + (top - 14) + ' M60 ' + (top + 8) + ' Q66 ' + (top - 6) + ' 72 ' + (top - 14) + '" fill="none" stroke="' + dk + '" stroke-width="3" stroke-linecap="round"/><circle cx="28" cy="' + (top - 14) + '" r="5.5" fill="' + tip + '"' + st + '/><circle cx="72" cy="' + (top - 14) + '" r="5.5" fill="' + tip + '"' + st + '/>';
  if (feat === 1) s += '<path d="M30 ' + (top + 12) + ' L25 ' + (top - 12) + ' L44 ' + (top + 4) + ' Z M70 ' + (top + 12) + ' L75 ' + (top - 12) + ' L56 ' + (top + 4) + ' Z" fill="' + tip + '"' + st + '/>';
  if (feat === 2) s += '<circle cx="28" cy="' + (top + 8) + '" r="11" fill="' + fill + '"' + st + '/><circle cx="72" cy="' + (top + 8) + '" r="11" fill="' + fill + '"' + st + '/>';
  if (feat === 3) s += '<path d="M35 ' + (top + 7) + ' L39 ' + (top - 10) + ' L46 ' + (top + 3) + ' Z M44 ' + (top + 2) + ' L50 ' + (top - 15) + ' L56 ' + (top + 2) + ' Z M54 ' + (top + 3) + ' L61 ' + (top - 10) + ' L65 ' + (top + 7) + ' Z" fill="' + tip + '"' + st + '/>';
  if (feat === 4) s += '<path d="M50 ' + (top + 4) + ' L50 ' + (top - 8) + '" stroke="' + dk + '" stroke-width="3" stroke-linecap="round"/><path d="M50 ' + (top - 8) + ' Q58 ' + (top - 22) + ' 70 ' + (top - 14) + ' Q60 ' + (top - 3) + ' 50 ' + (top - 8) + ' Z" fill="' + tip + '"' + st + '/>';

          el("p", { style: "font-size:15px" }, b.desc)))),
    el("div", { class: "dialog" },
      el("span", { class: "kicker" }, "+" + view.xp + " EXP" + (view.bonus ? " · includes 20 for a first clear" : "") + (view.misses ? " · " + view.misses + " miss" + (view.misses === 1 ? "" : "es") + " fixed" : " · no misses")),
      el("h2", null, "What you learned"),
      el("ul", { class: "learned" }, L.learned.map(t => el("li", null, t)))),
    nxt ? el("button", { id: "continue", class: "btn btn-go btn-block btn-stack", onclick: () => startLesson(nxt) }, "Next stop", el("span", { class: "btn-sub" }, n + 1 + ". " + nxt.title)) : null,
    el("button", { class: "btn btn-alt btn-block", onclick: () => go("map") }, "Back to the map"));
}

/* ---------- Training ---------- */
function renderTraining() {
  const misses = missed();
  const known = CARDS.filter(c => P.cards[c.id] === true).length;
  mount(
    trainerCard(), tabs("training"),
    el("button", { class: "btn btn-go btn-block btn-stack", onclick: () => startBattle(pickRound(QS), "Wild battle") }, "Wild battle", el("span", { class: "btn-sub" }, ROUND + " mixed questions, weakest first")),
    misses.length ? el("button", { class: "btn btn-yellow btn-block", onclick: () => startBattle(shuffle(misses).slice(0, ROUND), "Rematch") }, "Rematch your misses (" + misses.length + ")") : null,
    el("button", { class: "btn btn-alt btn-block", onclick: () => startCards(CARDS, "All study cards") }, "Study all " + CARDS.length + " cards (" + known + " known)"),
    el("p", { class: "section-title" }, "Train by topic"),
    TOPICS.map(t => {
      const qs = QS.filter(q => q.t === t.id), m = qs.filter(mastered).length, cs = CARDS.filter(c => c.t === t.id);
      return el("section", { class: "train-row", "aria-label": t.name },
        el("div", { class: "top" }, el("span", { class: "t" }, t.name), el("span", { class: "small" }, m + " / " + qs.length + " mastered")),
        el("div", { class: "bar", role: "progressbar", "aria-label": t.name + " mastery", "aria-valuemin": "0", "aria-valuemax": String(qs.length), "aria-valuenow": String(m) }, el("i", { style: "width:" + Math.round(100 * m / qs.length) + "%" })),
        el("div", { class: "duo" },
          el("button", { class: "btn btn-go", onclick: () => startBattle(pickRound(qs), t.name) }, "Battle"),
          el("button", { class: "btn btn-alt", onclick: () => startCards(cs, t.name) }, cs.length + " cards")));
    }),
    resetBlock());
}
function resetBlock() {
  if (!view.confirmReset) return el("button", { class: "linkish", onclick: () => { view.confirmReset = true; render(); } }, "Reset progress on this device");
  return el("div", { class: "confirm", role: "alertdialog", "aria-label": "Reset progress" },
    el("p", null, el("b", null, "Erase your level, badges, Bug Log, and mastery on this device?"), " This can’t be undone."),
    el("div", { class: "duo" },
      el("button", { class: "btn btn-go", onclick: () => { P = blank(); save(); go("training"); announce("Progress reset"); } }, "Erase"),
      el("button", { class: "btn btn-alt", onclick: () => { view.confirmReset = false; render(); } }, "Keep it")));
}

function startBattle(items, title) {
  if (!items.length) return;
  const logged = LESSONS.filter(lessonDone).map(l => l.id);
  const pool = logged.length ? logged : LESSONS.map(l => l.id);
  go("battle", { title, items, i: 0, picked: null, order: shuffle([0, 1, 2, 3]), results: [], bug: pool[Math.floor(Math.random() * pool.length)],
    foeHp: items.length, foeMax: items.length, meHp: 100, anim: "enter", lvBefore: level(P.xp) });
}
function battleAnswer(k) {
  if (view.picked !== null) return;
  const q = view.items[view.i], right = view.order[k] === 0;
  view.picked = k;
  const s = P.q[q.id] || { r: 0, w: 0 };
  if (right) { s.r++; P.xp += 10; view.foeHp--; view.anim = "foe"; } else { s.w++; view.meHp = Math.max(10, view.meHp - 15); view.anim = "me"; }
  s.last = right; P.q[q.id] = s; view.results.push({ q, right });
  markDay(); save();
  announce(right ? "Correct" : "Missed. The answer is " + q.a[0]);
  render(); focusNext();
}
function battleNext() {
  view.i++; view.picked = null; view.anim = null; view.order = shuffle([0, 1, 2, 3]);
  if (view.i >= view.items.length) { go("battleDone", { title: view.title, results: view.results, bug: view.bug, won: view.foeHp <= 0, leveled: level(P.xp) > view.lvBefore }); focusNext(); return; }
  render(); focusNext();
}
function renderBattle() {
  const q = view.items[view.i], b = BUGS[view.bug];
  const done = view.picked !== null, right = done && view.order[view.picked] === 0;
  mount(
    topbar(view.i + (done ? 1 : 0), view.items.length, "training"),
    scene(view.bug, view.foeHp, view.foeMax, view.meHp, view.anim),
    el("div", { class: "dialog" },
      view.i === 0 && !done ? el("p", { class: "announce" }, "A wild " + b.name + " appeared!") : null,
      el("span", { class: "kicker" }, view.title + " · " + topicName(q.t)),
      el("h2", null, q.q),
      q.code ? el("pre", { class: "code" }, q.code) : null,
      done ? el("div", { class: "result " + (right ? "result-good" : "result-bad") },
        el("span", { class: "verdict" }, right ? "Super effective! +10 EXP" : b.name + " dodged!"),
        el("p", null, el("b", null, "Why: "), q.why)) : null),
    moveList(q, view.order, view.picked, battleAnswer),
    done ? el("button", { id: "continue", class: "btn btn-yellow btn-block", onclick: battleNext }, view.i + 1 >= view.items.length ? "See results" : "Next") : el("p", { class: "note" }, "Tap an answer, or press A to D."));
}
function renderBattleDone() {
  const n = view.results.filter(r => r.right).length, total = view.results.length, b = BUGS[view.bug];
  const wrong = view.results.filter(r => !r.right).map(r => r.q);
  mount(
    topbar(total, total, "training"),
    view.leveled ? el("div", { class: "banner" }, el("p", { class: "t" }, "Level up!"), el("p", null, "You reached Lv " + level(P.xp) + ".")) : null,
    el("section", { class: "card" },
      el("div", { class: "catch" },
        el("div", { class: "pic" }, bugArt(view.bug, null, true)),
        el("div", null,
          el("span", { class: "kicker" }, view.title),
          el("h2", null, n + " / " + total + " correct"),
          el("p", { style: "font-size:16px" }, view.won ? "You won! " + b.name + " was defeated. +" + n * 10 + " EXP" : "The wild " + b.name + " got away. +" + n * 10 + " EXP. Rematch the misses below.")))),
    wrong.length ? el("p", { class: "section-title" }, "Moves to practice") : null,
    wrong.length ? el("div", { class: "missed" }, wrong.map(q => el("div", { class: "card" },
      el("p", { style: "font-weight:700" }, q.q, q.code ? el("span", { class: "mono" }, " " + q.code.split("\n")[0]) : null),
      el("p", { class: "ans" }, "✓ " + q.a[0]),
      el("p", { class: "muted", style: "font-size:15px" }, q.why)))) : null,
    wrong.length ? el("button", { id: "continue", class: "btn btn-go btn-block", onclick: () => startBattle(shuffle(wrong), "Rematch") }, "Rematch the " + wrong.length + " I missed") : null,
    el("button", { id: wrong.length ? null : "continue", class: wrong.length ? "btn btn-yellow btn-block" : "btn btn-go btn-block", onclick: () => startBattle(pickRound(QS), "Wild battle") }, "Another wild battle"),
    el("button", { class: "btn btn-alt btn-block", onclick: () => go("training") }, "Back to training"));
}

/* ---------- Study cards ---------- */
function startCards(cards, title) {
  if (!cards.length) return;
  const q = shuffle(cards).sort((a, b) => (P.cards[a.id] === true ? 1 : 0) - (P.cards[b.id] === true ? 1 : 0));
  go("cards", { title, queue: q, total: cards.length, flipped: false, got: 0, again: 0 });
}
function flip() { view.flipped = !view.flipped; render(); if (view.flipped) { const g = document.getElementById("got"); if (g) g.focus(); } }
function grade(knew) {
  const c = view.queue.shift();
  P.cards[c.id] = knew;
  if (knew) view.got++; else { view.again++; view.queue.push(c); }
  view.flipped = false; markDay(); save();
  if (!view.queue.length) { go("cardsDone", { title: view.title, total: view.total, again: view.again }); return; }
  render();
}
function renderCards() {
  const c = view.queue[0];
  mount(
    topbar(view.got, view.total, "training"),
    el("p", { class: "section-title" }, view.title + " · " + topicName(c.t)),
    el("button", { class: "card study" + (view.flipped ? " back" : ""), onclick: flip, "aria-label": view.flipped ? "Card answer. Tap to flip back." : "Card term. Tap to flip." },
      el("span", { class: "kicker" }, view.flipped ? "Answer" : "Term"),
      el("span", { class: "term" }, c.f),
      view.flipped ? el("span", { class: "def" }, c.b) : el("span", { class: "muted", style: "font-size:16px" }, "Say the answer out loud, then tap to flip.")),
    view.flipped
      ? el("div", { class: "duo" },
          el("button", { class: "btn btn-alt", onclick: () => grade(false) }, "Still learning"),
          el("button", { id: "got", class: "btn btn-go", onclick: () => grade(true) }, "Got it"))
      : el("p", { class: "note" }, view.queue.length + (view.queue.length === 1 ? " card" : " cards") + " left. “Still learning” cards come back at the end."));
}
function renderCardsDone() {
  mount(
    topbar(view.total, view.total, "training"),
    el("div", { class: "dialog" },
      el("span", { class: "kicker" }, view.title),
      el("h2", null, "All " + view.total + " cards known!"),
      el("p", null, view.again ? "You needed " + view.again + (view.again === 1 ? " repeat" : " repeats") + " to get there." : "Every card on the first try.")),
    el("button", { class: "btn btn-go btn-block", onclick: () => startBattle(pickRound(QS), "Wild battle") }, "Test it in a wild battle"),
    el("button", { class: "btn btn-alt btn-block", onclick: () => go("training") }, "Back to training"));
}

/* ---------- Bug Log ---------- */
function renderLog() {
  const got = LESSONS.filter(lessonDone).length;
  mount(
    trainerCard(), tabs("log"),
    el("p", { class: "section-title" }, "Bug Log · " + got + " / " + LESSONS.length + " logged"),
    el("p", { class: "note" }, "Clear a stop on the map to log its bug. Each one is a real beginner mistake, and its weakness is the fix."),
    el("div", { class: "log-grid" }, LESSONS.map((l, i) => {
      const seen = lessonDone(l), b = BUGS[l.id];
      return el("article", { class: "entry", "aria-label": seen ? b.name : "Unknown bug " + (i + 1) },
        el("div", { class: "pic" }, bugArt(l.id, null, seen)),
        el("div", { class: "top" },
          el("span", { class: "kicker" }, "#" + String(i + 1).padStart(2, "0")),
          seen ? el("span", { class: "type", style: "background:" + TYPE_COLORS[b.type][1] }, b.type) : null),
        el("span", { class: "nm" }, seen ? b.name : "???"),
        el("p", null, seen ? b.desc : "Clear stop " + (i + 1) + ": " + l.title + "."),
        seen ? el("p", null, el("b", null, "Weak to: "), b.weak) : null);
    })));
}

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  const k = map[e.key.toLowerCase()];
  if (k === undefined) {
    if (view.name === "cards" && e.key === " " && document.activeElement === document.body) { e.preventDefault(); flip(); }
    return;
  }
  if (view.name === "lesson" && view.steps[view.i].kind === "check" && view.picked === null) { e.preventDefault(); lessonAnswer(k); }
  else if (view.name === "battle" && view.picked === null) { e.preventDefault(); battleAnswer(k); }
});

render();
</script>
